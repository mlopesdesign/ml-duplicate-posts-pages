name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip publishing release (validation only)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -E "^ \* Version:" ml-duplicate-posts-pages/ml-duplicate-posts-pages.php | head -1 | sed -E 's/.*Version: ([0-9.]+).*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read plugin version from header"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Plugin version detected: $VERSION"

      - name: Validate PHP syntax
        run: |
          set -e
          for f in $(find ml-duplicate-posts-pages -name "*.php"); do
            echo "Linting $f"
            php -l "$f"
          done

      - name: Validate JS syntax
        run: |
          set -e
          for f in $(find ml-duplicate-posts-pages -name "*.js"); do
            echo "Linting $f"
            node --check "$f"
          done

      - name: Build ZIP
        run: |
          set -e
          SLUG=$(echo "${{ github.repository }}" | awk -F/ '{print $2}')
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${SLUG}-${VERSION}.zip"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" "$SLUG/" \
            -x "*.git*" "*.DS_Store" "node_modules/*" "vendor/*" \
            -x "${SLUG}/.git*" "${SLUG}/.github/*"
          ls -la "$ZIP_NAME"

      - name: Validate ZIP structure
        run: |
          set -e
          SLUG=$(echo "${{ github.repository }}" | awk -F/ '{print $2}')
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${SLUG}-${VERSION}.zip"

          echo "=== ZIP structure (top 30 entries) ==="
          unzip -l "$ZIP_NAME" | head -30

          # Check 1: first entry must be the slug folder
          FIRST_ENTRY=$(unzip -l "$ZIP_NAME" | awk 'NR==4 {print $4}')
          echo "First entry in ZIP: '$FIRST_ENTRY'"
          if [ "$FIRST_ENTRY" != "${SLUG}/" ]; then
            echo "::error::First entry must be '${SLUG}/' but is '$FIRST_ENTRY'. ZIP has wrong root folder."
            exit 1
          fi

          # Check 2: must NOT have double folder (e.g. slug/slug/)
          if unzip -l "$ZIP_NAME" | grep -q "${SLUG}/${SLUG}/"; then
            echo "::error::ZIP contains double folder '${SLUG}/${SLUG}/'. This breaks WordPress plugin upload."
            unzip -l "$ZIP_NAME" | grep "${SLUG}/${SLUG}/" | head -5
            exit 1
          fi

          # Check 3: main plugin file must exist
          MAIN_FILE=$(grep -E "^ \* Plugin Name:" ml-duplicate-posts-pages/${SLUG}.php 2>/dev/null && echo "ok")
          if ! unzip -l "$ZIP_NAME" | grep -q "${SLUG}/${SLUG}.php"; then
            echo "::error::Main plugin file '${SLUG}/${SLUG}.php' not found in ZIP."
            exit 1
          fi

          # Check 4: must NOT contain forbidden artifacts
          for forbidden in __MACOSX .DS_Store .git/ node_modules/ vendor/; do
            if unzip -l "$ZIP_NAME" | grep -q "$forbidden"; then
              echo "::error::ZIP contains forbidden path '$forbidden'."
              unzip -l "$ZIP_NAME" | grep "$forbidden" | head -3
              exit 1
            fi
          done

          echo "All ZIP structure checks passed."

      - name: Compute SHA-256
        id: sha
        run: |
          SLUG=$(echo "${{ github.repository }}" | awk -F/ '{print $2}')
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="${SLUG}-${VERSION}.zip"
          HASH=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$ZIP_NAME")
          echo "SHA256=$HASH" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "ZIP=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "Asset: $ZIP_NAME | SHA-256: $HASH | Size: $SIZE bytes"

      - name: Upload release asset
        if: github.event_name == 'push' && (github.event.head_commit.message != 'skip-release' || github.event_name == 'push')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.ZIP }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Print release summary
        if: always()
        run: |
          echo "### Release summary" >> $GITHUB_STEP_SUMMARY
          echo "- Asset: \`${{ steps.sha.outputs.ZIP }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256: \`${{ steps.sha.outputs.SHA256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ steps.sha.outputs.SIZE }} bytes" >> $GITHUB_STEP_SUMMARY

      - name: Warn if PAT not configured
        if: failure()
        run: |
          echo "::warning::Release asset upload failed. If the error is 'Resource not accessible by integration', configure a Personal Access Token as repository secret GH_RELEASE_TOKEN with 'contents: write' scope, then update this workflow to use it instead of GITHUB_TOKEN."