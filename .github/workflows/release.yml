name: Build release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -E "^ \* Version:" ml-duplicate-posts-pages.php | head -1 | sed -E 's/.*Version: ([0-9.]+).*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Plugin version detected: $VERSION"

      - name: Validate PHP syntax
        run: |
          for f in $(find . -name "*.php" -not -path "./vendor/*"); do
            php -l "$f"
          done

      - name: Validate JS syntax
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done

      - name: Build ZIP
        run: |
          SLUG=$(echo "${{ github.repository }}" | awk -F/ '{print $2}')
          ZIP_NAME="${SLUG}-${{ steps.version.outputs.VERSION }}.zip"
          rm -f "$ZIP_NAME"
          cd ..
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" "$SLUG" \
            -x "*.git*" "*.DS_Store" "node_modules/*" "vendor/*"
          cd "$GITHUB_WORKSPACE"
          ls -la "$ZIP_NAME"

      - name: Compute SHA-256
        id: sha
        run: |
          SLUG=$(echo "${{ github.repository }}" | awk -F/ '{print $2}')
          ZIP_NAME="${SLUG}-${{ steps.version.outputs.VERSION }}.zip"
          HASH=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$ZIP_NAME")
          echo "SHA256=$HASH" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "ZIP=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "Asset: $ZIP_NAME | SHA-256: $HASH | Size: $SIZE bytes"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.ZIP }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print release summary
        run: |
          echo "### Release summary" >> $GITHUB_STEP_SUMMARY
          echo "- Asset: \`${{ steps.sha.outputs.ZIP }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256: \`${{ steps.sha.outputs.SHA256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ steps.sha.outputs.SIZE }} bytes" >> $GITHUB_STEP_SUMMARY